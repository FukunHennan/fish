<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03111f">
<title>FISH CONTROL · 赛事界面总入口</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#03111f;color:#dff8ff;font-family:system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr);background:radial-gradient(circle at 45% -20%,rgba(30,214,255,.16),transparent 36%),linear-gradient(180deg,#041829,#020c16)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(64,211,255,.22);background:rgba(4,24,43,.94);box-shadow:0 6px 22px rgba(0,0,0,.24)}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.04em}.brand b{color:#47e5ff;font-style:italic}.brand span{font-size:12px;color:#7faec6;font-weight:700}
.tabs{display:flex;gap:8px}.tabs button{height:34px;padding:0 18px;border:1px solid rgba(74,198,243,.22);border-radius:7px;background:#082b49;color:#a8d8ec;font-weight:850;cursor:pointer}.tabs button.active{border-color:rgba(56,223,255,.55);background:linear-gradient(180deg,#0a79a8,#07507b);color:white;box-shadow:0 0 18px rgba(49,215,255,.1)}
.note{font-size:11px;color:#688fa5}.frameWrap{min-height:0;position:relative}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020d17}
@media(max-width:720px){.note{display:none}.top{padding:0 8px}.tabs button{padding:0 10px}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><b>FISH CONTROL</b><span>学生机器鱼赛事平台 · 界面总入口</span></div>
    <nav class="tabs"><button id="playerBtn" class="active">选手端</button><button id="refBtn">裁判端</button></nav>
    <div class="note">当前整合：选手端 v11 / 裁判端 v13</div>
  </header>
  <main class="frameWrap"><iframe id="appFrame" title="FISH CONTROL Interface"></iframe></main>
</div>
<script>
const SRC={player:"/competition/player_interface.html",referee:"/competition/referee_interface.html"};
const frame=document.getElementById("appFrame");
const playerBtn=document.getElementById("playerBtn");
const refBtn=document.getElementById("refBtn");
function show(which){
  frame.src=SRC[which];
  playerBtn.classList.toggle("active",which==="player");
  refBtn.classList.toggle("active",which==="referee");
}
playerBtn.onclick=()=>show("player");
refBtn.onclick=()=>show("referee");
show(location.hash==="#referee"?"referee":"player");
</script>
</body>
</html>
