<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03111f">
<title>FISH CONTROL · 赛事平台</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#03111f;color:#dff8ff;font-family:system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:54px minmax(0,1fr);background:radial-gradient(circle at 45% -20%,rgba(30,214,255,.16),transparent 36%),linear-gradient(180deg,#041829,#020c16)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(64,211,255,.22);background:rgba(4,24,43,.94);box-shadow:0 6px 22px rgba(0,0,0,.24)}
.brand{display:flex;align-items:center;font-weight:900;letter-spacing:.04em}.brand b{color:#47e5ff;font-style:italic}
.tabs{display:flex;gap:8px}.tabs button{height:34px;padding:0 18px;border:1px solid rgba(74,198,243,.22);border-radius:7px;background:#082b49;color:#a8d8ec;font-weight:850;cursor:pointer}.tabs button.active{border-color:rgba(56,223,255,.55);background:linear-gradient(180deg,#0a79a8,#07507b);color:white;box-shadow:0 0 18px rgba(49,215,255,.1)}
.frameWrap{min-height:0;position:relative}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020d17}
.loginGate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(1,10,22,.94)}.loginGate[hidden],.tabs [hidden]{display:none}.loginCard{width:min(380px,100%);padding:24px;border:1px solid rgba(56,223,255,.5);border-radius:14px;background:#08243b;box-shadow:0 20px 60px rgba(0,0,0,.45)}.loginCard h2{margin:0 0 8px;font-size:20px}.loginCard p{margin:0 0 16px;color:#a8d8ec;font-size:13px}.loginCard label{display:grid;gap:6px;font-size:12px}.loginCard input{width:100%;height:42px;margin:5px 0 12px;padding:0 12px;border:1px solid rgba(74,198,243,.4);border-radius:7px;background:#03111f;color:#dff8ff;font-size:15px}.loginCard button{width:100%;height:38px;border:1px solid rgba(74,198,243,.4);border-radius:7px;background:#0a5077;color:#fff;font-weight:800;cursor:pointer}.loginError{min-height:18px;margin-top:12px!important;color:#ff98a8!important}.accountBadge{align-self:center;color:#dff8ff;font-size:13px;font-weight:800}
@media(max-width:720px){.top{padding:0 8px}.tabs button{padding:0 10px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><b>FISH CONTROL</b></div>
    <nav class="tabs"><span id="accountBadge" class="accountBadge" hidden></span><button id="playerBtn" hidden>选手端</button><button id="refBtn" hidden>裁判端</button><button id="switchBtn" hidden>切换账号</button></nav>
  </header>
  <main class="frameWrap"><iframe id="appFrame" title="FISH CONTROL Interface"></iframe></main>
</div>
<div id="loginGate" class="loginGate" hidden>
  <form id="loginForm" class="loginCard">
    <h2>登录赛事平台</h2><p>账号 1 进入蓝队选手端，2 进入红队选手端，3 进入裁判端。</p>
    <label>账号<input id="accountInput" maxlength="20" autocomplete="username" aria-label="账号"></label>
    <label>密码<input id="passwordInput" type="password" autocomplete="current-password" aria-label="密码"></label>
    <button id="loginButton" type="submit">登录</button>
    <p id="loginError" class="loginError" role="alert"></p>
  </form>
</div>
<script>
const SRC={player:"/competition/player_interface.html",referee:"/competition/referee_interface.html"};
const frame=document.getElementById("appFrame");
const playerBtn=document.getElementById("playerBtn");
const refBtn=document.getElementById("refBtn");
const switchBtn=document.getElementById("switchBtn");
const accountBadge=document.getElementById("accountBadge");
const loginGate=document.getElementById("loginGate");
const accountInput=document.getElementById("accountInput");
const passwordInput=document.getElementById("passwordInput");
const loginError=document.getElementById("loginError");
const loginButton=document.getElementById("loginButton");
let tabId="tab-"+Math.random().toString(36).slice(2)+"-"+Date.now();
try{tabId=sessionStorage.getItem("fish-login-tab-id")||tabId;sessionStorage.setItem("fish-login-tab-id",tabId)}catch(_){}
let activeUser=null;
let checking=false;
let authRevision=0;
function routeFor(user){
  if(user?.role==="User"&&(user.email==="1"||user.email==="2"))return "player";
  if(user?.role==="Admin"&&user.email==="3")return "referee";
  return null;
}
function markerKey(user){return "fish-active-login:"+user.email}
function ownsTab(user){
  try{return JSON.parse(localStorage.getItem(markerKey(user))||"null")?.tabId===tabId}catch(_){return false}
}
function clearMarker(user){if(user&&ownsTab(user))try{localStorage.removeItem(markerKey(user))}catch(_){}}
function showLogin(message=""){
  authRevision++;
  clearMarker(activeUser);
  activeUser=null;
  frame.src="about:blank";
  playerBtn.hidden=refBtn.hidden=switchBtn.hidden=accountBadge.hidden=true;
  loginGate.hidden=false;
  loginError.textContent=message;
  passwordInput.value="";
  accountInput.focus();
}
function enter(user,takeover=false){
  const route=routeFor(user);
  if(!route){showLogin("该账号尚未分配选手端或裁判端");return}
  if(!takeover){
    try{
      const marker=JSON.parse(localStorage.getItem(markerKey(user))||"null");
      if(marker&&marker.tabId!==tabId){showLogin("该账号已在另一标签页使用，请输入密码重新登录");return}
    }catch(_){}
  }
  clearMarker(activeUser);
  authRevision++;
  try{localStorage.setItem(markerKey(user),JSON.stringify({tabId,email:user.email}))}catch(_){}
  activeUser=user;
  loginGate.hidden=true;
  accountBadge.textContent=(user.email==="1"?"蓝队":user.email==="2"?"红队":"裁判")+" · "+user.email;
  accountBadge.hidden=false;
  playerBtn.hidden=route!=="player";
  refBtn.hidden=route!=="referee";
  switchBtn.hidden=false;
  playerBtn.classList.toggle("active",route==="player");
  refBtn.classList.toggle("active",route==="referee");
  frame.src=SRC[route];
}
async function checkSession(){
  if(checking)return;
  checking=true;
  const revision=authRevision;
  try{
    const response=await fetch("/api/auth/me",{cache:"no-store"});
    const session=await response.json();
    if(revision!==authRevision)return;
    if(!response.ok||!session.authenticated||!session.user){
      if(activeUser)showLogin("登录已失效，请重新登录");
      else if(loginGate.hidden)showLogin();
      return;
    }
    if(activeUser){
      if(session.user.id!==activeUser.id||!ownsTab(activeUser))showLogin("该账号已在另一页面登录，请重新登录");
    }else enter(session.user);
  }catch(_){if(revision===authRevision&&!activeUser){
    if(loginGate.hidden)showLogin("无法连接服务器，请稍后重试");
    else loginError.textContent="无法连接服务器，请稍后重试";
  }}
  finally{checking=false}
}
document.getElementById("loginForm").onsubmit=async(event)=>{
  event.preventDefault();
  authRevision++;
  loginError.textContent="";
  const account=accountInput.value.trim();
  if(!account){loginError.textContent="请输入账号";return}
  loginButton.disabled=true;
  try{
    const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:account,password:passwordInput.value})});
    const result=await response.json();
    if(!response.ok||!result.authenticated)throw new Error(result.message||"登录失败");
    passwordInput.value="";
    enter(result.user,true);
  }catch(error){loginError.textContent=error.message||"登录失败"}
  finally{loginButton.disabled=false}
};
switchBtn.onclick=async()=>{
  const previous=activeUser;
  frame.src="about:blank";
  try{await fetch("/api/auth/logout",{method:"POST"})}catch(_){}
  clearMarker(previous);
  showLogin();
};
window.addEventListener("storage",event=>{
  if(activeUser&&event.key===markerKey(activeUser)&&!ownsTab(activeUser))showLogin("该账号已在另一标签页登录");
});
window.addEventListener("message",event=>{
  if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==="fish-auth-expired")checkSession();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkSession()});
playerBtn.onclick=()=>checkSession();
refBtn.onclick=()=>checkSession();
checkSession();
setInterval(checkSession,4000);
</script>
</body>
</html>
