<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器鱼 AP 配网原型</title><style>:root{--bg:#f4f7fb;--card:#fff;--line:#dfe7f0;--text:#172033;--muted:#6f7d8c;--blue:#1677ff;--green:#18a058}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#eef5ff,#f7f9fc 35%,#f4f7fb);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:var(--text)}button,input{font:inherit}.shell{width:min(440px,calc(100% - 24px));margin:auto;padding:24px 0}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(145deg,#2f8cff,#1268e8)}h1,h2{margin:0}.brand h1{font-size:20px}.brand small{color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:0 12px 36px rgba(40,65,95,.08)}.section{padding:16px}.tip{padding:12px;border-radius:12px;background:#eaf3ff;color:#315780;font-size:13px;line-height:1.5}.title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.title button{border:0;background:transparent;color:var(--blue);font-weight:700}.status{font-size:12px;color:var(--muted);margin-bottom:8px}.wifi-list{display:flex;flex-direction:column;gap:8px;max-height:270px;overflow:auto}.wifi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.wifi.selected{border-color:var(--blue);background:#f3f8ff}.wifi strong,.wifi small{display:block}.wifi small{font-size:12px;color:var(--muted);margin-top:4px}.signal{text-align:right;font-size:12px}.signal small{color:var(--muted)}.form{padding:16px;border-top:1px solid var(--line)}label{display:block;font-size:13px;font-weight:700;margin-bottom:12px}input{width:100%;height:44px;margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none}.field{position:relative}.toggle{position:absolute;right:8px;top:13px;border:0;background:transparent;color:var(--blue);font-size:12px}.save{width:100%;height:46px;border:0;border-radius:11px;background:linear-gradient(#2c86ff,#126de9);color:#fff;font-weight:800}.success{display:none;padding:28px 16px;text-align:center}.icon{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#eaf8f0;color:var(--green);font-size:28px;font-weight:900}.success p{color:var(--muted);font-size:13px;line-height:1.6}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}</style></head><body><div class="shell"><div class="brand"><div class="logo">F</div><div><h1>机器鱼 Wi‑Fi 配网</h1><small>Fish-Setup-8A3C · 192.168.4.1</small></div></div><div class="card"><div id="setup"><div class="section"><div class="tip">请选择附近的 2.4 GHz Wi‑Fi。保存后设备会重启，并自动连接到同一局域网中的控制电脑。</div><div class="title"><strong>附近网络</strong><button id="refresh">重新扫描</button></div><div class="status" id="scanStatus">正在扫描附近 Wi‑Fi…</div><div class="wifi-list" id="wifiList"></div></div><div class="form"><label>Wi‑Fi 名称<div class="field"><input id="ssid" placeholder="选择上方网络，或手动输入 SSID"></div></label><label>Wi‑Fi 密码<div class="field"><input id="password" type="password" placeholder="请输入 Wi‑Fi 密码"><button class="toggle" id="toggle" type="button">显示</button></div></label><label>设备名称<input id="name" value="机器鱼" maxlength="24"></label><button class="save" id="save">保存并重启</button></div></div><div class="success" id="success"><div class="icon">✓</div><h2>配置已保存</h2><p>设备正在重启并尝试连接所选 Wi‑Fi。<br>稍后 Fish-Setup 热点会自动消失。</p></div></div><div class="foot">交互原型 · 不连接真实 ESP32</div></div><script>const nets=[{ssid:'Lab-WiFi',rssi:-42,lock:1},{ssid:'Tank-Router',rssi:-55,lock:1},{ssid:'Office-2.4G',rssi:-63,lock:1},{ssid:'Phone-Hotspot',rssi:-71,lock:1},{ssid:'Open-Test-Net',rssi:-76,lock:0}];let selected='';function bars(r){return r>=-50?'▂▄▆█':r>=-60?'▂▄▆':r>=-70?'▂▄':'▂'}function render(){wifiList.innerHTML='';nets.sort((a,b)=>b.rssi-a.rssi).forEach(n=>{const b=document.createElement('button');b.className='wifi'+(selected===n.ssid?' selected':'');b.innerHTML=`<span><strong>${n.ssid} ${n.lock?'🔒':''}</strong><small>${n.lock?'需要密码':'开放网络'}</small></span><span class="signal"><b>${n.rssi} dBm</b><small>${bars(n.rssi)}</small></span>`;b.onclick=()=>{selected=n.ssid;ssid.value=n.ssid;render()};wifiList.appendChild(b)});scanStatus.textContent=`发现 ${nets.length} 个可用网络，按信号强度排序`}function scan(){scanStatus.textContent='正在扫描附近 Wi‑Fi…';wifiList.innerHTML='';refresh.disabled=true;setTimeout(()=>{render();refresh.disabled=false},600)}refresh.onclick=scan;toggle.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.textContent=show?'隐藏':'显示'};save.onclick=()=>{if(!ssid.value.trim())return alert('请选择或输入 Wi-Fi 名称');if(!name.value.trim())return alert('请输入设备名称');save.disabled=true;save.textContent='正在保存…';setTimeout(()=>{setup.style.display='none';success.style.display='block'},800)};scan();</script></body></html>
