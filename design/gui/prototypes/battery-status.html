<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fish Battery GUI Prototype</title><style>:root{--bg:#0a0f14;--panel:#111820;--line:#24313c;--text:#eef5f7;--muted:#8fa0ab;--accent:#46d8c7;--green:#57d98a;--yellow:#f0c44f;--red:#ff667d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,var(--accent),#237f91,#284776)}h1,h2,h3{margin:0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--accent)}h1{font-size:16px}.metrics{display:flex;gap:8px}.metric{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#10171d;font-size:10px}.metric b{font-size:14px}.metric.low b{color:var(--red)}.main{padding:10px 12px;display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:10px}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(#121a22,#0e151b);overflow:hidden}.head{padding:12px;border-bottom:1px solid var(--line)}.head h2{font-size:15px}.list{padding:10px;display:flex;flex-direction:column;gap:7px}.device{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:#111a21;color:var(--text);text-align:left}.device.selected{border-color:#367c74;background:#15312d}.device.low{border-color:#6d5425;background:#231d12}.device.critical{border-color:#71323d;background:#2a151a}.device strong,.device small{display:block}.device small{font-size:8.5px;color:var(--muted);margin-top:4px}.check{width:14px;height:14px;border:1px solid #49606b;border-radius:4px;display:grid;place-items:center;font-size:9px}.battery-wrap{display:flex;align-items:center;gap:6px}.battery{position:relative;width:30px;height:14px;border:1px solid #677985;border-radius:3px;padding:2px}.battery:after{content:"";position:absolute;right:-4px;top:4px;width:3px;height:6px;background:#677985}.fill{height:100%;background:var(--green)}.device.low .fill{background:var(--yellow)}.device.critical .fill{background:var(--red)}.percent{font-size:9px;font-weight:800}.vision{min-height:610px;display:grid;place-items:center;background:#07111a}.fish{width:160px;height:56px;border:2px solid rgba(70,216,199,.8);border-radius:60% 40% 45% 55%;transform:rotate(-10deg)}.section{padding:12px;border-bottom:1px solid var(--line)}.battery-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:#101820}.big{display:flex;align-items:center;gap:12px}.battery-large{position:relative;width:78px;height:32px;border:2px solid #677985;border-radius:5px;padding:4px}.battery-large:after{content:"";position:absolute;right:-7px;top:9px;width:5px;height:12px;background:#677985}.value b{display:block;font-size:24px}.value small{color:var(--muted)}.progress{height:8px;background:#0d151c;border-radius:999px;overflow:hidden;margin:12px 0}.progress div{height:100%}.details{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:10px}.details div:nth-child(odd){color:var(--muted)}.warning{display:none;margin-top:10px;padding:9px 10px;border-radius:8px;font-size:9px}.warning.low{display:block;background:#211b13;border:1px solid #6b502b;color:#e8c886}.warning.critical{display:block;background:#2a151a;border:1px solid #71323d;color:#ffb2bd}.sim{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}@media(max-width:900px){.main{grid-template-columns:1fr}.vision{min-height:420px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">F</div><div><div class="eyebrow">FISH CONTROL CENTER</div><h1>多机器鱼视觉中央控制台</h1></div></div><div class="metrics"><div class="metric"><b>3</b> 在线 / 3</div><div class="metric low"><b id="lowCount">1</b> 低电量</div></div></header><main class="main"><aside class="panel"><div class="head"><div class="eyebrow">DEVICES</div><h2>机器鱼</h2></div><div class="list" id="list"></div></aside><section class="panel"><div class="head"><div class="eyebrow">VISION</div><h2>视觉工作区</h2></div><div class="vision"><div class="fish"></div></div></section><aside class="panel"><div class="section"><div class="eyebrow">CONTROL TARGET</div><h2 id="target"></h2></div><div class="section"><h3>电池状态</h3><div class="battery-card"><div class="big"><div class="battery-large"><div class="fill" id="bigFill"></div></div><div class="value"><b id="pct"></b><small id="state"></small></div></div><div class="progress"><div id="bar"></div></div><div class="details"><div>电池电压</div><div id="voltage"></div><div>电量</div><div id="pct2"></div><div>状态</div><div id="state2"></div><div>最后更新</div><div>1 秒前</div></div><div class="warning" id="warn"></div></div></div><div class="section"><h3>电量演示</h3><div class="sim"><input id="sim" type="range" min="0" max="100"><span id="simv"></span></div></div></aside></main></div><script>const ds=[{n:'机器鱼 01',m:'前进 · 2.5 Hz',b:82,v:4.03},{n:'机器鱼 02',m:'待机 · 2.3 Hz',b:43,v:3.78},{n:'机器鱼 03',m:'停止 · 2.5 Hz',b:16,v:3.52}];let sel=0;function cls(p){return p<20?'critical':p<40?'low':''}function st(p){if(p<10)return['严重低电量','critical'];if(p<20)return['低电量','critical'];if(p<40)return['电量偏低','low'];return['电量正常','']}function render(){list.innerHTML='';ds.forEach((d,i)=>{const b=document.createElement('button');b.className='device '+cls(d.b)+(sel===i?' selected':'');b.innerHTML=`<span class="check">${sel===i?'✓':''}</span><span><strong>${d.n}</strong><small>${d.m}</small></span><span class="battery-wrap"><span class="battery"><span class="fill" style="display:block;width:${d.b}%"></span></span><span class="percent">${d.b}%</span></span>`;b.onclick=()=>{sel=i;render()};list.appendChild(b)});const d=ds[sel],s=st(d.b),c=s[1]==='critical'?'var(--red)':s[1]==='low'?'var(--yellow)':'var(--green)';target.textContent=d.n;pct.textContent=pct2.textContent=d.b+'%';state.textContent=state2.textContent=s[0];voltage.textContent=d.v.toFixed(2)+' V';bigFill.style.width=d.b+'%';bigFill.style.background=bar.style.background=c;bar.style.width=d.b+'%';warn.className='warning';warn.textContent='';if(s[1]==='low'){warn.classList.add('low');warn.textContent='电量偏低，建议尽快更换或充电。'}if(s[1]==='critical'){warn.classList.add('critical');warn.textContent=d.b<10?'严重低电量：建议尽快停止实验并回收设备。':'低电量：建议尽快回收设备。'}sim.value=d.b;simv.textContent=d.b+'%';lowCount.textContent=ds.filter(x=>x.b<20).length}sim.oninput=e=>{const v=Number(e.target.value);ds[sel].b=v;ds[sel].v=3.3+v/100*0.9;render()};render();</script></body></html>
