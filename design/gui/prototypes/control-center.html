<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fish Control Center Prototype</title><style>:root{--bg:#0a0f14;--panel:#111820;--line:#24313c;--text:#eef5f7;--muted:#8fa0ab;--accent:#46d8c7;--green:#57d98a;--red:#ff667d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,var(--accent),#237f91,#284776)}h1,h2{margin:0}h1{font-size:16px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--accent)}.actions{display:flex;gap:8px;align-items:center}.pill,.tabs button,.stop{border:1px solid var(--line);border-radius:9px;background:#10171d;color:var(--text);padding:8px 10px;font-size:10px}.tabs button.active{background:#15312d;border-color:#367c74}.stop{background:#8d2739;border-color:#d65068;font-weight:900}.main{padding:10px 12px;display:grid;grid-template-columns:230px minmax(0,1fr) 310px;gap:10px}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(#121a22,#0e151b);overflow:hidden}.head{padding:12px;border-bottom:1px solid var(--line)}.head h2{font-size:15px}.list{padding:10px;display:flex;flex-direction:column;gap:7px}.device{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:#111a21;color:var(--text);text-align:left}.device.selected{border-color:#367c74;background:#15312d}.check{width:14px;height:14px;border:1px solid #49606b;border-radius:4px;display:grid;place-items:center;font-size:9px}.device strong,.device small{display:block}.device small{font-size:8.5px;color:var(--muted);margin-top:4px}.vision{min-height:640px;display:grid;place-items:center;background:#07111a;position:relative}.fish{width:160px;height:56px;border:2px solid rgba(70,216,199,.8);border-radius:60% 40% 45% 55%;transform:rotate(-10deg)}.right .section{padding:12px;border-bottom:1px solid var(--line)}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips span{padding:4px 7px;border:1px solid #2a504b;border-radius:999px;background:#132521;color:#bfe7e0;font-size:8px}.range{margin:10px 0}.range label{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.range input{width:100%}.motion{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.motion button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:#161f27;color:#cbd7dc;font-size:10px}.motion .idle{grid-column:1/-1}.motion button.active{background:#15312d;border-color:#367c74}.feedback{margin-top:8px;font-size:9px;color:var(--muted)}@media(max-width:900px){.main{grid-template-columns:1fr}.vision{min-height:420px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">F</div><div><div class="eyebrow">FISH CONTROL CENTER</div><h1>多机器鱼视觉中央控制台</h1></div></div><div class="actions"><div class="tabs"><button class="active">控制台</button><button>OTA / 设置</button></div><div class="pill">在线 2/3</div><button class="stop" id="allStop">ALL STOP</button></div></header><main class="main"><aside class="panel"><div class="head"><div class="eyebrow">DEVICES</div><h2>机器鱼</h2></div><div class="list" id="deviceList"></div></aside><section class="panel"><div class="head"><div class="eyebrow">VISION</div><h2>视觉工作区</h2></div><div class="vision"><div class="fish"></div></div></section><aside class="panel right"><div class="section"><div class="eyebrow">CONTROL TARGET</div><h2 id="target">未选择设备</h2><div class="chips" id="chips"></div></div><div class="section"><div class="range"><label><span>频率</span><b id="fv">2.5 Hz</b></label><input id="freq" type="range" min="0.3" max="5" step="0.1" value="2.5"></div><div class="range"><label><span>幅度</span><b id="av">28°</b></label><input id="amp" type="range" min="0" max="50" value="28"></div><div class="range"><label><span>偏置</span><b id="bv">0°</b></label><input id="bias" type="range" min="-45" max="45" value="0"></div></div><div class="section"><div class="motion"><button data-m="左转">左转</button><button data-m="前进">前进</button><button data-m="右转">右转</button><button class="idle" data-m="IDLE">IDLE</button></div><div class="feedback" id="feedback">等待控制指令</div></div></aside></main></div><script>const ds=[{n:'机器鱼 01',s:'前进 · 2.5 Hz'},{n:'机器鱼 02',s:'待机 · 2.3 Hz'},{n:'机器鱼 03',s:'离线'}];let sel=new Set();function render(){deviceList.innerHTML='';ds.forEach((d,i)=>{const b=document.createElement('button');b.className='device'+(sel.has(i)?' selected':'');b.disabled=i===2;b.innerHTML=`<span class="check">${sel.has(i)?'✓':''}</span><span><strong>${d.n}</strong><small>${d.s}</small></span><span>${i===2?'○':'●'}</span>`;b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);render();target.textContent=sel.size?`已选择 ${sel.size} 台`:'未选择设备';chips.innerHTML=[...sel].map(x=>`<span>${ds[x].n}</span>`).join('')};deviceList.appendChild(b)})}render();freq.oninput=e=>fv.textContent=Number(e.target.value).toFixed(1)+' Hz';amp.oninput=e=>av.textContent=e.target.value+'°';bias.oninput=e=>bv.textContent=e.target.value+'°';document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');feedback.textContent=`已发送：${b.dataset.m} · ${sel.size} 台设备`});allStop.onclick=()=>feedback.textContent='ALL STOP：全部在线设备停止';</script></body></html>
