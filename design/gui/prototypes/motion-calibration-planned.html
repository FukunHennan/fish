<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手动控制与运动校准 - Planned</title><style>:root{--bg:#091018;--p:#111a23;--l:#263744;--t:#eef7f8;--m:#8ea1ad;--a:#45d8c7;--g:#57d98a;--y:#f0c44f;--r:#ff667d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--l)}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,var(--a),#257f91,#334f81)}h1,h2,h3,p{margin:0}.eye{font-size:9px;color:var(--a);font-weight:900;letter-spacing:.13em}.tag{font-size:8px;color:#f3d66b;border:1px solid #705e28;border-radius:999px;padding:3px 6px}.stop{padding:10px 16px;background:#8d2739;color:#fff;border:1px solid #d65068;border-radius:9px;font-weight:900}.layout{padding:10px 12px;display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:10px;min-height:calc(100vh - 100px)}.panel{border:1px solid var(--l);border-radius:14px;background:linear-gradient(#121c25,#0e161d);overflow:hidden}.head{padding:11px 12px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:8px}.head h2{font-size:14px}.head span{font-size:8px;color:var(--m)}.list{padding:10px;display:flex;flex-direction:column;gap:7px}.dev{padding:9px;border:1px solid var(--l);border-radius:9px;background:#111a22;color:var(--t);text-align:left}.dev.on{border-color:#3b8177;background:#15302d}.dev strong,.dev small{display:block}.dev strong{font-size:10px}.dev small{font-size:8px;color:var(--m);margin-top:4px}.status{display:flex;gap:5px;margin-top:6px}.pill{font-size:7.5px;border:1px solid var(--l);border-radius:999px;padding:3px 5px}.good{color:#bff3d3;border-color:#315d46}.warn{color:#f1d17a;border-color:#6f592a}.center{display:grid;grid-template-rows:auto auto 1fr auto}.steps{padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;border-bottom:1px solid var(--l)}.step{padding:7px 5px;border:1px solid var(--l);border-radius:8px;background:#101820;text-align:center;font-size:8px;color:var(--m)}.step.on{border-color:#3d8177;background:#15302d;color:#d8fff8}.workspace{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--l);border-radius:10px;background:#101820;padding:11px}.card h3{font-size:12px;margin-bottom:9px}.row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:9px}.row label{color:var(--m)}input[type=range]{width:100%;accent-color:var(--a)}input[type=number],select{width:100%;background:#0d151c;color:var(--t);border:1px solid var(--l);border-radius:7px;padding:7px}.motions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.motions button,.actions button{min-height:42px;border:1px solid var(--l);border-radius:9px;background:#16212a;color:#d7e0e4;font-weight:800}.motions button b{display:block;font-size:10px}.motions button small{display:block;margin-top:4px;color:var(--m);font-size:8px}.motions .danger,.actions .danger{border-color:#8a3a48;background:#3a1820;color:#ffc3cc}.guide{grid-column:1/-1}.guidebody{display:grid;grid-template-columns:1fr 180px;gap:10px}.instruction{padding:12px;border:1px dashed #3b5260;border-radius:9px;min-height:150px}.instruction strong{font-size:13px}.instruction p{font-size:9px;color:var(--m);line-height:1.6;margin-top:8px}.actions{display:grid;gap:6px}.footerbar{padding:10px 12px;border-top:1px solid var(--l);display:flex;justify-content:space-between;gap:8px}.footerbar button{min-height:34px;padding:0 12px;border:1px solid var(--l);border-radius:8px;background:#16212a;color:#d7e0e4}.right .section{padding:11px;border-bottom:1px solid var(--l)}.right h3{font-size:12px;margin-bottom:9px}.chain{display:flex;flex-direction:column;gap:6px}.chain div{padding:8px;border:1px solid var(--l);border-radius:8px;background:#101820;font-size:9px}.chain .ok{border-color:#315d46;color:#bff3d3}.chain .active{border-color:#6a5b2a;color:#f2d47c}.kv{display:grid;grid-template-columns:105px 1fr;gap:7px 10px;font-size:8.5px}.kv div:nth-child(odd){color:var(--m)}pre{white-space:pre-wrap;font-size:8px;line-height:1.45;color:#b9ccd3;background:#0a1218;border:1px solid var(--l);border-radius:8px;padding:9px}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.result-actions button{min-height:32px;border:1px solid var(--l);border-radius:8px;background:#16212a;color:#d7e0e4;font-size:8.5px}@media(max-width:1100px){.layout{grid-template-columns:220px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.guide{grid-column:auto}.steps{grid-template-columns:repeat(2,1fr)}.right{display:block}}</style></head><body><header class="top"><div class="brand"><div class="logo">F</div><div><div class="eye">FISH CONTROL CENTER</div><h1>手动控制与运动校准 <span class="tag">PLANNED</span></h1></div></div><button class="stop" id="estop">立即停止</button></header><main class="layout"><aside class="panel"><div class="head"><div><div class="eye">DEVICE SELECT</div><h2>选择一条机器鱼</h2></div><span>MAC 唯一身份</span></div><div class="list" id="devlist"></div></aside><section class="panel center"><div class="head"><div><div class="eye">CALIBRATION WIZARD</div><h2 id="fishTitle">机器鱼 01</h2></div><span id="macTitle">E0:72:A1:1D:41:50</span></div><div class="steps" id="steps"></div><div class="workspace"><section class="card"><h3>实时手动控制</h3><div class="row"><label>频率</label><input id="freq" type="range" min="0.3" max="5" step="0.1" value="2.5"><b id="fv">2.5 Hz</b></div><div class="row"><label>摆动幅度</label><input id="amp" type="range" min="0" max="50" value="28"><b id="av">28°</b></div><div class="row"><label>转向强度</label><input id="pct" type="range" min="0" max="100" value="50"><b id="pv">50%</b></div><div class="motions"><button id="forward"><b>前进</b><small id="forwardp"></small></button><button id="left"><b>左转 50%</b><small id="leftp"></small></button><button id="right"><b>右转 50%</b><small id="rightp"></small></button><button class="danger" id="stop"><b>停止</b><small>立即发送 STOP</small></button></div></section><section class="card"><h3>当前标定参数</h3><div class="row"><label>直行偏置 B₀</label><input id="bias" type="range" min="-45" max="45" value="4"><b id="bv">+4°</b></div><div class="row"><label>增加偏置转向</label><select id="sign"><option value="LEFT">LEFT</option><option value="RIGHT">RIGHT</option></select><span></span></div><div class="row"><label>左转最大偏移</label><input id="lmax" type="number" min="0" max="45" value="24"><b>°</b></div><div class="row"><label>右转最大偏移</label><input id="rmax" type="number" min="0" max="45" value="20"><b>°</b></div><div class="row"><label>默认转向百分比</label><input id="defp" type="number" min="0" max="100" value="50"><b>%</b></div></section><section class="card guide"><h3>标定向导</h3><div class="guidebody"><div class="instruction"><strong id="guideTitle"></strong><p id="guideText"></p></div><div class="actions"><button id="startTest">开始测试</button><button class="danger" id="stopTest">立即停止</button><button id="retry">重试</button><button id="confirm">确认结果</button></div></div></section></div><div class="footerbar"><button id="prev">← 返回上一步</button><span style="font-size:8px;color:var(--m);align-self:center">设备未 ACK 时禁止进入下一步</span><button id="next">下一步 →</button></div></section><aside class="panel right"><div class="section"><div class="eye">ACK CLOSED LOOP</div><h3>指令闭环状态</h3><div class="chain" id="chain"></div></div><div class="section"><h3>本次测试</h3><div class="kv"><div>请求 ID</div><div id="req">—</div><div>发送参数</div><div id="sent">—</div><div>ACK 耗时</div><div id="latency">—</div><div>设备实际应用</div><div id="applied">—</div><div>stopReason</div><div id="reason">NONE</div><div>错误码</div><div id="err">—</div></div></div><div class="section"><h3>MotionCalibrationProfile</h3><pre id="profile"></pre><div class="result-actions"><button>保存</button><button>重新校准</button><button>恢复上个版本</button><button>恢复默认值</button><button>导出参数</button></div></div></aside></main><script>const fishes=[{name:'机器鱼 01',mac:'E0:72:A1:1D:41:50',fw:'1.2.0',source:'MANUAL',done:true},{name:'机器鱼 02',mac:'E0:72:A1:1D:41:51',fw:'1.2.0',source:'IDLE',done:false},{name:'机器鱼 03',mac:'E0:72:A1:1D:41:52',fw:'1.1.8',source:'VISION',done:true}];const stepNames=['执行器检查','直行偏置','转向符号','左转最大偏移','右转最大偏移','结果验证','保存标定'];const guide=[['执行器检查','依次执行舵机居中、小幅正偏置、小幅负偏置、停止。若执行器没有动作，禁止继续。'],['直行偏置','从偏置 0 开始，以 ±1° 或滑块调整，每次短距离前进，直到机器鱼基本直行，保存为 B₀。'],['转向符号','以 B₀ 为中心测试 B₀ + 10°，观察实际向左还是向右；必要时用 B₀ - 10° 交叉验证。'],['左转最大偏移','按 25% → 50% → 75% → 100% 逐级测试，可在任意一级停止，并将当前安全值保存为左转最大偏移。'],['右转最大偏移','按 25% → 50% → 75% → 100% 逐级测试，左右必须独立标定，不能假设对称。'],['结果验证','依次执行前进、左转 50%、右转 50%、停止。全部符合预期后才标记为完成。'],['保存标定','保存当前 MAC 对应的 MotionCalibrationProfile，并生成新版本。控制器是主要配置来源。']];let selected=0,step=0,acked=true;function sgn(){return sign.value==='LEFT'?1:-1}function clamp(v){return Math.max(-45,Math.min(45,v))}function values(){const b=+bias.value,p=+pct.value,l=+lmax.value,r=+rmax.value,s=sgn();return{b,p,left:clamp(b+s*l*p/100),right:clamp(b-s*r*p/100)}}function renderDevices(){devlist.innerHTML='';fishes.forEach((f,i)=>{const b=document.createElement('button');b.className='dev'+(i===selected?' on':'');b.innerHTML=`<strong>${f.name}</strong><small>${f.mac}</small><small>FW ${f.fw} · 控制来源 ${f.source}</small><div class="status"><span class="pill good">● 在线</span><span class="pill ${f.done?'good':'warn'}">${f.done?'标定完整':'未完成标定'}</span></div>`;b.onclick=()=>{selected=i;fishTitle.textContent=f.name;macTitle.textContent=f.mac;renderDevices();renderProfile()};devlist.appendChild(b)})}function renderSteps(){steps.innerHTML=stepNames.map((x,i)=>`<button class="step ${i===step?'on':''}" data-i="${i}">${i+1}. ${x}</button>`).join('');steps.querySelectorAll('button').forEach(b=>b.onclick=()=>{step=+b.dataset.i;acked=true;renderSteps();renderGuide()})}function renderGuide(){guideTitle.textContent=guide[step][0];guideText.textContent=guide[step][1]}function renderMotion(){const v=values();fv.textContent=(+freq.value).toFixed(1)+' Hz';av.textContent=amp.value+'°';pv.textContent=pct.value+'%';bv.textContent=(v.b>=0?'+':'')+v.b+'°';forward.querySelector('b').textContent='前进';left.querySelector('b').textContent=`左转 ${v.p}%`;right.querySelector('b').textContent=`右转 ${v.p}%`;forwardp.textContent=`${(+freq.value).toFixed(1)} Hz / ${amp.value}° / bias ${v.b>=0?'+':''}${v.b}°`;leftp.textContent=`${(+freq.value).toFixed(1)} Hz / ${amp.value}° / bias ${v.left>=0?'+':''}${v.left.toFixed(1)}°`;rightp.textContent=`${(+freq.value).toFixed(1)} Hz / ${amp.value}° / bias ${v.right>=0?'+':''}${v.right.toFixed(1)}°`;renderProfile()}function renderProfile(){const f=fishes[selected],v=values();profile.textContent=JSON.stringify({deviceId:f.mac,version:1,forward:{frequency:+freq.value,amplitude:+amp.value,bias:+bias.value},steering:{increaseTurns:sign.value,leftMaxOffset:+lmax.value,rightMaxOffset:+rmax.value,defaultPercent:+defp.value},calibrated:{forward:step>=1,steeringDirection:step>=2,leftRange:step>=3,rightRange:step>=4},updatedAt:'2026-08-27T16:30:00+08:00'},null,2)}function chainState(n=0){const items=['GUI 已提交','控制器已发送','ESP32 已确认','设备正在运动','设备已停止','本次测试完成'];chain.innerHTML=items.map((x,i)=>`<div class="${i<n?'ok':i===n?'active':''}">${i<n?'✓':i===n?'●':'○'} ${x}</div>`).join('')}function test(mode,biasVal){const id='motion-'+Math.random().toString(16).slice(2,10);req.textContent=id;sent.textContent=`${mode} / ${(+freq.value).toFixed(1)}Hz / ${amp.value}° / bias ${biasVal.toFixed(1)}°`;latency.textContent='—';applied.textContent='等待 ACK';err.textContent='—';acked=false;chainState(1);setTimeout(()=>{chainState(2);latency.textContent='38 ms';applied.textContent=sent.textContent;acked=true},350);setTimeout(()=>chainState(3),650);setTimeout(()=>{chainState(5);reason.textContent='TEST_DURATION_DONE'},1450)}function stopNow(){chainState(4);reason.textContent='USER_STOP';applied.textContent='STOP';acked=true}function bind(){[freq,amp,pct,bias,lmax,rmax,defp].forEach(x=>x.oninput=renderMotion);sign.onchange=renderMotion;forward.onclick=()=>test('FORWARD',values().b);left.onclick=()=>test('LEFT',values().left);right.onclick=()=>test('RIGHT',values().right);stop.onclick=stopNow;estop.onclick=stopNow;stopTest.onclick=stopNow;startTest.onclick=()=>test(step===1?'FORWARD':'CALIBRATION_TEST',values().b);retry.onclick=()=>test('RETRY',values().b);confirm.onclick=()=>acked=true;prev.onclick=()=>{if(step>0){step--;renderSteps();renderGuide()}};next.onclick=()=>{if(!acked){alert('设备尚未 ACK，不能进入下一步');return}if(step<6){step++;renderSteps();renderGuide()}}}renderDevices();renderSteps();renderGuide();renderMotion();chainState(0);bind();</script></body></html>
