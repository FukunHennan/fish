<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#031229" />
<title>Fish Control 学生赛事端</title>
<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#competition-root {
  width: 100%;
  min-width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: #dff8ff;
  background:
    radial-gradient(circle at 14% 20%, rgba(24, 222, 255, 0.16), transparent 26%),
    radial-gradient(circle at 83% 12%, rgba(34, 122, 255, 0.2), transparent 30%),
    linear-gradient(180deg, #020c1f 0%, #031a32 52%, #02101f 100%);
  font-family:
    "Inter",
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;
}

button,
select {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
}

.competitionApp {
  --cyan: #22e7ff;
  --blue: #1f8cff;
  --deep: rgba(3, 22, 45, 0.92);
  --panel: rgba(5, 35, 68, 0.78);
  --panel-strong: rgba(7, 48, 91, 0.92);
  --line: rgba(57, 200, 255, 0.45);
  --line-soft: rgba(92, 210, 255, 0.24);
  --green: #29f5a2;
  --orange: #ffbb3b;
  --red: #ff4665;
  --violet: #9f5bff;
  position: relative;
  display: grid;
  width: 100%;
  height: 100vh;
  place-items: center;
  padding: 0;
  overflow: hidden;
}

.competitionApp::before {
  position: absolute;
  inset: -12%;
  content: "";
  background:
    linear-gradient(110deg, transparent 18%, rgba(43, 225, 255, 0.08) 22%, transparent 30%),
    repeating-linear-gradient(90deg, rgba(45, 194, 255, 0.035) 0 1px, transparent 1px 82px),
    repeating-linear-gradient(0deg, rgba(45, 194, 255, 0.026) 0 1px, transparent 1px 82px);
  filter: blur(0.2px);
  transform: rotate(-1deg);
  animation: ambientDrift 18s linear infinite;
}

.competitionApp::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
  background:
    radial-gradient(ellipse at 50% 0%, rgba(84, 218, 255, 0.2), transparent 36%),
    linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 10, 26, 0.28));
}

.designShell {
  position: relative;
  z-index: 1;
  display: grid;
  container-type: size;
  width: min(100vw, calc(100vh * var(--ratio-value)));
  max-width: 100vw;
  max-height: 100dvh;
  aspect-ratio: var(--page-ratio);
  grid-template-rows: 7.2% minmax(0, 1fr) 3.4%;
  overflow: hidden;
  color: #dff9ff;
  background:
    linear-gradient(180deg, rgba(5, 26, 56, 0.88), rgba(1, 13, 30, 0.96)),
    radial-gradient(circle at 50% 18%, rgba(40, 205, 255, 0.16), transparent 40%);
  border: 1px solid rgba(57, 190, 255, 0.42);
  box-shadow: 0 0 42px rgba(0, 172, 255, 0.18), inset 0 0 45px rgba(0, 166, 255, 0.12);
  font-size: clamp(5px, 0.84cqw, 14px);
}

.designShell::before,
.designShell::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
}

.designShell::before {
  z-index: -1;
  background:
    radial-gradient(ellipse at 44% 0%, rgba(95, 235, 255, 0.16), transparent 22%),
    linear-gradient(95deg, transparent 0 42%, rgba(42, 222, 255, 0.07) 48%, transparent 56%);
  opacity: 0.92;
}

.designShell::after {
  z-index: 20;
  border: 1px solid rgba(91, 230, 255, 0.28);
  box-shadow: inset 0 0 0 1px rgba(24, 151, 255, 0.22), inset 0 0 60px rgba(10, 128, 219, 0.12);
}

.competitionHeader {
  display: grid;
  grid-template-columns: 28% 43% 29%;
  align-items: center;
  min-width: 0;
  padding: 0 1%;
  border-bottom: 1px solid rgba(32, 171, 247, 0.35);
  background: linear-gradient(180deg, rgba(3, 23, 51, 0.94), rgba(1, 13, 31, 0.78));
}

.brandBlock {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 2.4%;
}

.brandBlock h1 {
  margin: 0;
  overflow: hidden;
  color: #f3fbff;
  font-size: 2.15em;
  font-style: italic;
  line-height: 1;
  text-overflow: ellipsis;
  text-shadow: 0 0 18px rgba(38, 218, 255, 0.3);
  white-space: nowrap;
}

.brandBlock h1 span {
  color: var(--cyan);
}

.brandBlock p,
.headerSlogan,
.competitionFooter {
  margin: 0;
  color: #83cff5;
  letter-spacing: 0;
}

.brandBlock p {
  margin-top: 0.36em;
  font-size: 0.9em;
}

.fishLogo {
  position: relative;
  display: inline-grid;
  width: 4.35em;
  aspect-ratio: 1.55;
  flex: 0 0 auto;
  place-items: center;
}

.fishLogo::before,
.fishLogo::after,
.fishLogo i {
  position: absolute;
  content: "";
  border: 0.28em solid #34d9ff;
}

.fishLogo::before {
  width: 78%;
  height: 68%;
  border-right-width: 0;
  border-radius: 72% 42% 54% 66%;
  transform: skewX(-13deg);
  box-shadow: 0 0 13px rgba(47, 218, 255, 0.55);
}

.fishLogo::after {
  right: 0;
  width: 29%;
  height: 48%;
  border-left-width: 0;
  border-radius: 0 60% 60% 0;
  transform: rotate(45deg);
}

.fishLogo i {
  right: 28%;
  width: 0.32em;
  height: 0.32em;
  padding: 0;
  border-width: 0.14em;
  border-radius: 999px;
  background: #fff;
}

.dockNav {
  display: grid;
  height: 74%;
  grid-template-columns: repeat(4, 1fr);
  align-items: end;
  gap: 0.7%;
  padding: 0 1.4%;
}

.dockItem {
  --dock-scale: 1;
  --dock-lift: 0px;
  display: flex;
  height: 100%;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 8%;
  padding: 0 6%;
  overflow: hidden;
  border: 1px solid rgba(70, 178, 255, 0.24);
  border-radius: 0 0 8px 8px;
  background: linear-gradient(180deg, rgba(12, 58, 108, 0.22), rgba(9, 33, 67, 0.72));
  box-shadow: inset 0 -8px 20px rgba(0, 136, 255, 0.08);
  color: #c6e9ff;
  font-size: 1.15em;
  font-weight: 800;
  letter-spacing: 0;
  transform: translateY(var(--dock-lift)) scale(var(--dock-scale));
  transform-origin: bottom center;
  transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
  white-space: nowrap;
}

.dockItem.active,
.dockItem:hover {
  border-color: rgba(34, 231, 255, 0.88);
  background: linear-gradient(180deg, rgba(17, 135, 255, 0.7), rgba(5, 42, 88, 0.88));
  box-shadow: 0 0 24px rgba(21, 191, 255, 0.42), inset 0 -8px 20px rgba(42, 234, 255, 0.2);
  color: #f2fdff;
}

.dockItem.active::after,
.dockItem:hover::after {
  position: absolute;
  right: 16%;
  bottom: 0;
  left: 16%;
  height: 0.18em;
  border-radius: 999px 999px 0 0;
  background: #25efff;
  box-shadow: 0 0 16px #25efff;
  content: "";
}

.dockIcon {
  position: relative;
  display: inline-block;
  width: 1.45em;
  aspect-ratio: 1;
  flex: 0 0 auto;
}

.dockIcon::before,
.dockIcon::after {
  position: absolute;
  content: "";
}

.dockIcon.home::before {
  inset: 26% 12% 18%;
  border: 0.22em solid currentColor;
  border-top: 0;
  border-radius: 0.16em;
}

.dockIcon.home::after {
  inset: 8% 18% auto;
  height: 52%;
  border-left: 0.22em solid currentColor;
  border-top: 0.22em solid currentColor;
  transform: rotate(45deg);
}

.dockIcon.pad::before {
  inset: 22% 4%;
  border: 0.22em solid currentColor;
  border-radius: 42% 42% 48% 48%;
}

.dockIcon.pad::after {
  inset: 41% 29% auto;
  height: 0.22em;
  background: currentColor;
  box-shadow: -0.32em 0 currentColor, 0.8em -0.16em 0 -0.02em currentColor, 1.12em 0.14em 0 -0.02em currentColor;
}

.dockIcon.flag::before {
  inset: 11% auto 10% 24%;
  width: 0.22em;
  background: currentColor;
}

.dockIcon.flag::after {
  inset: 14% 22% auto 36%;
  height: 42%;
  background: currentColor;
  clip-path: polygon(0 0, 100% 10%, 72% 52%, 100% 92%, 0 82%);
}

.dockIcon.chart::before {
  inset: 20% 16% 18%;
  border-left: 0.2em solid currentColor;
  border-bottom: 0.2em solid currentColor;
}

.dockIcon.chart::after {
  right: 20%;
  bottom: 24%;
  width: 0.26em;
  height: 58%;
  background: currentColor;
  box-shadow: -0.48em 0.2em 0 currentColor, -0.96em -0.08em 0 currentColor;
}

.headerSlogan {
  justify-self: end;
  font-size: 1.05em;
  font-style: italic;
}

.competitionFooter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.1%;
  border-top: 1px solid rgba(31, 171, 255, 0.25);
  background: rgba(1, 12, 27, 0.68);
  font-size: 0.82em;
}

.screen {
  min-width: 0;
  min-height: 0;
  padding: 0.7%;
}

.glassCard {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: linear-gradient(180deg, rgba(8, 43, 84, 0.82), rgba(2, 22, 45, 0.92));
  box-shadow: inset 0 0 26px rgba(36, 183, 255, 0.09), 0 10px 28px rgba(0, 0, 0, 0.24);
}

.glassCard::before {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
  background:
    linear-gradient(110deg, transparent 0 35%, rgba(81, 224, 255, 0.08) 44%, transparent 55%),
    radial-gradient(circle at 16% 0%, rgba(61, 224, 255, 0.16), transparent 34%);
}

.glassCard::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent 26%);
  opacity: 0.52;
}

.hoverCard {
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, filter 180ms ease;
}

.hoverCard:hover {
  z-index: 5;
  border-color: rgba(39, 238, 255, 0.88);
  box-shadow: 0 0 28px rgba(26, 208, 255, 0.24), inset 0 0 28px rgba(31, 202, 255, 0.16);
  filter: saturate(1.08);
  transform: translateY(-0.35%) scale(1.012);
}

button {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, filter 160ms ease;
}

button::before {
  position: absolute;
  inset: -40% 110% -40% -70%;
  z-index: -1;
  pointer-events: none;
  content: "";
  background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.34), transparent 64%);
  transform: translateX(-40%);
  transition: transform 420ms ease;
}

button:hover {
  filter: brightness(1.08) saturate(1.12);
  transform: translateY(-1px);
}

button:hover::before {
  transform: translateX(118%);
}

h2,
h3,
p {
  margin: 0;
}

.lobbyScreen {
  display: grid;
  grid-template-columns: 21% minmax(0, 57.4%) 21%;
  grid-template-rows: 67.8% 31.2%;
  gap: 1%;
}

.spacePanel,
.lobbyHero,
.lobbyStatus,
.quickPanel {
  position: relative;
}

.spacePanel {
  display: grid;
  grid-template-rows: 8% 19% auto auto 9% 1fr;
  align-items: start;
  padding: 5% 6%;
}

.spacePanel header,
.quickPanel header,
.fieldPanel header,
.recordList header,
.replayStage header,
.matchHud,
.missionArena header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2%;
}

.spacePanel h2,
.lobbyStatus h2,
.continuePanel h2,
.quickPanel h2,
.controlRail h2,
.fieldPanel h2,
.tacticsPanel h2,
.taskSelect h2,
.missionArena h2,
.strategyPanel h2,
.recordList h2,
.recordHeader h2,
.replayStage h2,
.scorePanel h2 {
  color: #f2fcff;
  font-size: 1.45em;
  line-height: 1.16;
}

.spacePanel header button,
.quickPanel header button,
.recordList header button {
  border: 0;
  background: transparent;
  color: #9edcff;
}

.teamBadge {
  display: grid;
  width: 34%;
  aspect-ratio: 1;
  margin: 4% 0 0 4%;
  place-items: center;
  border: 0.28em solid rgba(44, 224, 255, 0.78);
  border-radius: 999px;
  box-shadow: 0 0 24px rgba(27, 206, 255, 0.36);
}

.teamBadge .fishLogo {
  width: 72%;
}

.spacePanel h3 {
  font-size: 1.55em;
}

.spacePanel p,
.lobbyHero > p,
.heroCard p,
.taskSelect > p,
.strategyPanel > p {
  color: #a2cdea;
  line-height: 1.55;
}

.deviceStatus {
  display: flex;
  align-items: center;
  gap: 3%;
  margin-top: 8%;
  padding: 6% 0;
  border-top: 1px solid rgba(104, 203, 255, 0.18);
  color: #d4f7ff;
}

.deviceStatus i,
.statusTile strong::before {
  display: inline-block;
  width: 0.7em;
  aspect-ratio: 1;
  border-radius: 999px;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  content: "";
}

.outlineButton,
.heroCard button,
.continuePanel button,
.retryButton,
.strategyActions button {
  border: 1px solid rgba(57, 213, 255, 0.55);
  border-radius: 7px;
  background: linear-gradient(180deg, #25e8ff, #168bff);
  box-shadow: 0 0 18px rgba(22, 171, 255, 0.28);
  color: #02213e;
  font-weight: 900;
}

.outlineButton {
  width: 100%;
  height: 7.5%;
  margin-top: 6%;
  background: rgba(20, 84, 133, 0.46);
  color: #daf9ff;
}

.spacePanel small {
  align-self: end;
  justify-self: center;
  color: #7db9e2;
  line-height: 1.6;
  text-align: center;
}

.lobbyHero {
  display: grid;
  grid-template-rows: 24% 8% 14% 48%;
  justify-items: center;
  padding: 3% 3% 2%;
  text-align: center;
}

.waterBeam {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(79, 236, 255, 0.42), transparent 36%),
    linear-gradient(180deg, rgba(58, 228, 255, 0.08), transparent 42%);
}

.lobbyHero h2 {
  position: relative;
  align-self: end;
  color: #f6fdff;
  font-size: 3.55em;
  line-height: 1;
  text-shadow: 0 0 22px rgba(73, 225, 255, 0.46);
}

.lobbyHero > p {
  position: relative;
  font-size: 1.25em;
}

.heroCards,
.trainingCards,
.scoreTiles,
.missionStats,
.evalGrid,
.telemetryGrid {
  display: grid;
  min-width: 0;
  min-height: 0;
  gap: 1.4%;
}

.heroCards {
  position: relative;
  width: 100%;
  grid-template-columns: repeat(3, 1fr);
}

.heroCard {
  display: grid;
  grid-template-rows: 34% 15% 17% 13% 16%;
  justify-items: center;
  padding: 9% 8% 7%;
  border: 1px solid rgba(40, 224, 255, 0.62);
  border-radius: 8px;
  background: rgba(7, 46, 84, 0.62);
}

.heroIcon {
  position: relative;
  display: block;
  width: 42%;
  aspect-ratio: 1;
}

.heroIcon::before,
.heroIcon::after,
.docIcon::before,
.docIcon::after,
.cube::before {
  position: absolute;
  content: "";
}

.heroIcon.trophy::before {
  inset: 8% 20% 28%;
  border-radius: 0 0 28% 28%;
  background: linear-gradient(180deg, #46ffff, #189cff);
  box-shadow: 0 0 24px rgba(50, 226, 255, 0.6);
}

.heroIcon.trophy::after {
  inset: 62% 34% 8%;
  border-radius: 5px;
  background: #36ddff;
  box-shadow: -1.1em -2.2em 0 -0.55em transparent, 0 0 14px rgba(55, 228, 255, 0.5);
}

.heroIcon.compass::before {
  inset: 12%;
  border: 0.55em solid rgba(48, 228, 255, 0.9);
  border-radius: 999px;
}

.heroIcon.compass::after {
  inset: 32% 28%;
  background: linear-gradient(135deg, transparent 48%, #54f7ff 50%), linear-gradient(315deg, transparent 48%, #168bff 50%);
  clip-path: polygon(50% 0, 70% 45%, 50% 100%, 30% 55%);
}

.heroIcon.link::before {
  inset: 23% 12%;
  border: 0.5em solid #2edfff;
  border-radius: 60% 42% 60% 42%;
  transform: rotate(-25deg);
}

.heroIcon.link::after {
  inset: 29% 24%;
  border: 0.5em solid #42f6ff;
  border-radius: 60% 42% 60% 42%;
  transform: rotate(-25deg);
}

.heroCard h3 {
  font-size: 1.6em;
}

.heroCard b {
  align-self: center;
  width: 78%;
  padding: 0.45em;
  border: 1px solid rgba(42, 230, 255, 0.32);
  border-radius: 6px;
  color: var(--green);
  font-size: 0.95em;
}

.heroCard button,
.continuePanel button {
  width: 94%;
  min-height: 3.3em;
}

.lobbyStatus {
  display: grid;
  grid-template-rows: 64% 34%;
  gap: 2%;
}

.lobbyStatus > .glassCard,
.continuePanel {
  padding: 7%;
}

.statusList {
  display: grid;
  height: 86%;
  gap: 3%;
  margin-top: 4%;
}

.statusTile {
  display: flex;
  min-width: 0;
  min-height: 0;
  align-items: center;
  justify-content: space-between;
  padding: 0.7em 0.9em;
  border: 1px solid rgba(54, 179, 255, 0.24);
  border-radius: 6px;
  background: rgba(7, 36, 69, 0.74);
  color: #b8def5;
}

.statusTile span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.statusTile strong {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 0.45em;
  color: #38dfff;
  font-size: 1.24em;
  white-space: nowrap;
}

.statusTile.green strong {
  color: var(--green);
}

.statusTile.orange strong {
  color: var(--orange);
}

.statusTile.red strong {
  color: var(--red);
}

.continuePanel > div {
  display: grid;
  height: 74%;
  grid-template-columns: 25% 1fr 38%;
  align-items: center;
  gap: 4%;
}

.docIcon {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  border: 0.3em solid #37d9ff;
  border-radius: 999px;
}

.docIcon::before {
  inset: 25% 30%;
  border-top: 0.22em solid currentColor;
  border-bottom: 0.22em solid currentColor;
  color: #37d9ff;
}

.docIcon::after {
  inset: 40% 30%;
  border-top: 0.22em solid currentColor;
  color: #37d9ff;
}

.continuePanel p {
  display: grid;
  gap: 0.35em;
}

.continuePanel small {
  color: #8ac8ed;
}

.quickPanel {
  grid-column: 1 / -1;
  display: grid;
  grid-template-rows: 18% 1fr;
  padding: 1.3%;
}

.trainingCards {
  grid-template-columns: repeat(3, 1fr);
}

.trainingCard {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 9%;
  grid-template-rows: 62% 18% 16%;
  min-width: 0;
  min-height: 0;
  padding: 2%;
  overflow: hidden;
  border: 1px solid rgba(52, 195, 255, 0.28);
  border-radius: 7px;
  background: rgba(7, 42, 79, 0.72);
  text-align: left;
}

.trainingImage {
  grid-column: 1 / -1;
  display: block;
  width: 100%;
  min-height: 0;
  border-radius: 4px;
  background:
    linear-gradient(120deg, rgba(29, 231, 255, 0.15), transparent 44%),
    radial-gradient(circle at 22% 60%, rgba(54, 226, 255, 0.6), transparent 9%),
    radial-gradient(circle at 68% 44%, rgba(19, 117, 226, 0.7), transparent 10%),
    linear-gradient(180deg, rgba(57, 217, 255, 0.4), rgba(6, 67, 116, 0.88));
}

.trainingImage.t1 {
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0 26px, transparent 26px 72px),
    linear-gradient(180deg, rgba(70, 214, 255, 0.38), rgba(4, 55, 98, 0.86));
}

.trainingImage.t2 {
  background:
    radial-gradient(ellipse at 50% 50%, transparent 22%, rgba(48, 244, 255, 0.95) 23% 25%, transparent 26%),
    radial-gradient(circle at 22% 46%, rgba(54, 226, 255, 0.64), transparent 9%),
    radial-gradient(circle at 78% 46%, rgba(40, 156, 255, 0.7), transparent 9%),
    linear-gradient(180deg, rgba(57, 217, 255, 0.38), rgba(6, 67, 116, 0.86));
}

.trainingCard strong,
.trainingCard small {
  grid-column: 1;
}

.trainingCard strong {
  align-self: end;
  font-size: 1.2em;
}

.trainingCard small {
  color: #8dc8e8;
}

.trainingCard i {
  grid-column: 2;
  grid-row: 2 / 4;
  align-self: center;
  justify-self: center;
  display: grid;
  width: 2.55em;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 999px;
  background: rgba(50, 161, 230, 0.2);
  color: #bcedff;
  font-style: normal;
}

.controlScreen {
  display: grid;
  grid-template-columns: 21.3% minmax(0, 55.5%) 22.4%;
  grid-template-rows: 15.4% minmax(0, 1fr);
  gap: 0.7%;
}

.matchHud {
  grid-column: 1 / -1;
  display: grid;
  grid-template-rows: 62% 38%;
  min-width: 0;
  gap: 0.55%;
  padding: 0.6% 1%;
  border-bottom: 1px solid rgba(42, 190, 255, 0.24);
}

.hudTop {
  display: grid;
  grid-template-columns: 21% 21.5% 8.5% repeat(3, 7.9%) 10.8% 9.1%;
  min-width: 0;
  gap: 0.55%;
}

.hudTop .statusTile {
  display: grid;
  grid-template-columns: 1fr;
  align-content: center;
  justify-items: center;
  gap: 0.18em;
  padding: 0.42em 0.58em;
}

.hudTop .statusTile span {
  flex: 0 0 auto;
  overflow: visible;
  font-size: 0.86em;
  line-height: 1.08;
  text-overflow: clip;
  white-space: nowrap;
}

.hudTop .statusTile strong {
  justify-content: center;
  font-size: 1.2em;
}

.hudTitle h2 {
  overflow: hidden;
  font-size: 1.18em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hudTitle p {
  margin-top: 0.45em;
  overflow: hidden;
  color: #82c9ee;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hudScore {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4%;
  border: 1px solid rgba(35, 149, 255, 0.5);
  background: linear-gradient(90deg, rgba(16, 105, 255, 0.4), rgba(255, 40, 82, 0.24));
  font-weight: 900;
}

.hudScore span {
  color: #b6daf5;
}

.hudScore b {
  font-size: 2em;
}

.hudScore .blue {
  color: #31d6ff;
}

.hudScore .red {
  color: #ff536f;
}

.visionBadge,
.stopButton {
  border-radius: 8px;
  font-size: 1.18em;
  font-weight: 900;
}

.visionBadge {
  border: 1px solid rgba(36, 255, 156, 0.8);
  background: rgba(12, 102, 74, 0.48);
  color: #47ffb0;
}

.stopButton {
  border: 1px solid rgba(255, 83, 101, 0.9);
  background: linear-gradient(180deg, rgba(171, 43, 54, 0.86), rgba(74, 12, 24, 0.92));
  color: #ffb1b9;
}

.phaseRail {
  display: grid;
  grid-template-columns: 16.5% 16.5% 16.5% 1fr;
  align-items: center;
  gap: 1.2%;
  padding-top: 0.2em;
  color: #a9dcfa;
  font-size: 0.92em;
}

.phaseRail span {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  gap: 0.45em;
  white-space: nowrap;
}

.phaseRail span::before {
  display: inline-block;
  width: 1.3em;
  aspect-ratio: 1;
  border: 1px solid rgba(87, 219, 255, 0.7);
  border-radius: 999px;
  background: rgba(11, 80, 139, 0.66);
  box-shadow: 0 0 12px rgba(39, 202, 255, 0.28);
  content: "";
}

.phaseRail span::after {
  position: absolute;
  top: 50%;
  left: calc(50% + 4.5em);
  width: 42%;
  height: 0.25em;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(45, 217, 255, 0.8), rgba(42, 136, 255, 0.28));
  content: "";
}

.phaseRail span:nth-of-type(3)::after {
  display: none;
}

.phaseRail .done::before {
  background: radial-gradient(circle, #d9ffff 0 28%, #2fecff 30% 100%);
}

.phaseRail .active::before {
  background: radial-gradient(circle, #fff 0 18%, #227dff 20% 100%);
  box-shadow: 0 0 16px rgba(58, 185, 255, 0.78);
}

.phaseRail b {
  justify-self: end;
  color: #88d7ff;
  font-weight: 800;
}

.controlRail {
  display: grid;
  grid-template-rows: 8% 15% 20% 42% 12%;
  gap: 1.6%;
  padding: 5%;
}

.controlRail header span,
.fieldPanel header span,
.tacticsPanel header span,
.missionArena header span {
  color: #83d8ff;
  font-weight: 700;
}

.controlFish {
  display: grid;
  grid-template-columns: 24% 1fr 32%;
  align-items: center;
  gap: 4%;
  padding: 5%;
  border: 1px solid rgba(62, 185, 255, 0.28);
  border-radius: 7px;
  background: rgba(7, 38, 75, 0.72);
}

.fishChip,
.fishMarker {
  display: block;
  border-radius: 999px 68% 999px 68%;
  background: linear-gradient(135deg, #3cf1ff, #126bff 62%, #05162e 63%);
  box-shadow: 0 0 14px rgba(39, 211, 255, 0.55);
  transform: skewX(-13deg);
}

.fishChip {
  width: 100%;
  aspect-ratio: 1.7;
}

.controlFish h3 {
  font-size: 2em;
}

.controlFish b,
.fishChip + div + b {
  padding: 0.45em 0.7em;
  border: 1px solid rgba(39, 206, 255, 0.54);
  border-radius: 999px;
  color: #6beeff;
  text-align: center;
}

.telemetryGrid {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
}

.wasdPad {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: 30% 30% 30%;
  gap: 4%;
}

.wasdPad button {
  display: grid;
  place-items: center;
  border: 1px solid rgba(83, 192, 255, 0.55);
  border-radius: 8px;
  background: linear-gradient(180deg, rgba(27, 130, 232, 0.9), rgba(9, 64, 132, 0.96));
  box-shadow: inset 0 0 18px rgba(67, 206, 255, 0.16);
  font-size: 2.1em;
  font-weight: 900;
}

.wasdPad button span {
  font-size: 0.45em;
}

.wasdPad .forward,
.wasdPad .space {
  grid-column: 1 / -1;
  justify-self: center;
  width: 68%;
}

.wasdPad .space {
  width: 100%;
  border-color: rgba(255, 80, 101, 0.86);
  background: linear-gradient(180deg, rgba(255, 65, 85, 0.9), rgba(105, 18, 36, 0.96));
}

.railStatus {
  padding: 4%;
  border: 1px solid rgba(57, 181, 255, 0.25);
  border-radius: 7px;
  background: rgba(6, 36, 70, 0.62);
}

.railStatus p {
  display: flex;
  justify-content: space-between;
  margin-top: 5%;
}

.railStatus span,
.railStatus b {
  color: #57eaff;
}

.railStatus em {
  color: #9dcced;
  font-style: normal;
}

.fieldPanel {
  display: grid;
  grid-template-rows: 6.7% minmax(0, 1fr) 4.3%;
  padding: 0.7%;
}

.fieldPanel footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #bce9ff;
}

.tacticsPanel {
  display: grid;
  grid-template-rows: 53% 16% 29%;
  gap: 1.3%;
}

.tacticsPanel .glassCard {
  padding: 4%;
}

.tacticsPanel .poolStage.compact {
  height: 49%;
  margin-top: 3%;
}

.sideMetricRow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2%;
  margin: 3% 0;
}

.adviceCard {
  display: grid;
  grid-template-columns: 15% 1fr 8%;
  align-items: center;
  gap: 3%;
  padding: 3%;
  border: 1px solid rgba(51, 223, 255, 0.34);
  border-radius: 7px;
  background: linear-gradient(90deg, rgba(25, 176, 154, 0.42), rgba(11, 55, 95, 0.72));
}

.cube {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, #62ffdb, #1b9eff);
  clip-path: polygon(50% 0, 94% 25%, 94% 75%, 50% 100%, 6% 75%, 6% 25%);
}

.adviceCard small {
  display: block;
  margin-top: 0.4em;
  color: #8bd6ed;
}

.signalButtons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2%;
  margin-top: 5%;
}

.signalButtons button {
  min-height: 3.3em;
  border: 1px solid rgba(74, 199, 255, 0.46);
  border-radius: 7px;
  background: rgba(9, 79, 146, 0.75);
  font-weight: 800;
}

.eventLine {
  display: flex;
  justify-content: space-between;
  margin-top: 7%;
  color: #a8daf3;
}

.eventLine span {
  color: #5ee8ff;
}

.poolStage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid rgba(92, 221, 255, 0.42);
  border-radius: 5px;
  background:
    radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.22), transparent 6%),
    radial-gradient(circle at 70% 62%, rgba(255, 255, 255, 0.18), transparent 8%),
    repeating-linear-gradient(108deg, rgba(255, 255, 255, 0.075) 0 2px, transparent 2px 24px),
    linear-gradient(180deg, #1eb4cc, #0b7fb0 55%, #0a4f7f);
  box-shadow: inset 0 0 44px rgba(255, 255, 255, 0.12), inset 0 0 0 0.42em rgba(2, 26, 55, 0.34);
}

.poolStage::before {
  position: absolute;
  inset: 2.4%;
  z-index: 1;
  pointer-events: none;
  border: 0.42em solid rgba(2, 36, 75, 0.52);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(189, 244, 255, 0.22), 0 0 16px rgba(2, 14, 32, 0.38);
  content: "";
}

.poolWater,
.poolCaustics {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.poolWater {
  z-index: 0;
  background:
    radial-gradient(ellipse at 18% 30%, rgba(255, 255, 255, 0.18), transparent 17%),
    radial-gradient(ellipse at 74% 62%, rgba(255, 255, 255, 0.13), transparent 19%),
    linear-gradient(90deg, rgba(255, 255, 255, 0.06), transparent 18%, rgba(255, 255, 255, 0.08) 52%, transparent 80%);
  mix-blend-mode: screen;
  animation: waterBreath 7s ease-in-out infinite alternate;
}

.poolCaustics {
  z-index: 0;
  background:
    repeating-linear-gradient(104deg, transparent 0 1.15em, rgba(255, 255, 255, 0.11) 1.22em 1.34em, transparent 1.45em 3.4em),
    repeating-linear-gradient(72deg, transparent 0 1.8em, rgba(161, 245, 255, 0.08) 1.88em 2em, transparent 2.1em 4.8em);
  opacity: 0.7;
  animation: causticsSlide 12s linear infinite;
}

.poolGrid {
  position: absolute;
  inset: 7% 5%;
  z-index: 2;
  border: 2px solid rgba(255, 255, 255, 0.42);
  opacity: 0.52;
}

.poolGrid::before,
.poolGrid::after {
  position: absolute;
  content: "";
  background: rgba(255, 255, 255, 0.38);
}

.poolGrid::before {
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
}

.poolGrid::after {
  top: 0;
  left: 50%;
  width: 2px;
  height: 100%;
}

.baseZone {
  position: absolute;
  z-index: 3;
  top: 30%;
  display: grid;
  width: 11%;
  height: 36%;
  place-items: center;
  color: #fff;
  font-size: 1.22em;
  font-weight: 900;
  writing-mode: vertical-rl;
}

.baseZone.blue {
  left: 6%;
  background: rgba(19, 87, 255, 0.58);
}

.baseZone.red {
  right: 6%;
  background: rgba(255, 47, 70, 0.58);
}

.fishMarker {
  position: absolute;
  z-index: 5;
  width: 7%;
  aspect-ratio: 1.72;
  translate: -50% -50%;
  animation: fishGlide 2.6s ease-in-out infinite alternate;
}

.fishMarker::before {
  position: absolute;
  left: 50%;
  bottom: 112%;
  padding: 0.24em 0.55em;
  border: 1px solid currentColor;
  border-radius: 4px;
  background: rgba(5, 25, 48, 0.78);
  color: #fff;
  content: attr(data-label);
  font-weight: 900;
  white-space: nowrap;
  translate: -50% 0;
}

.fishMarker.red {
  background: linear-gradient(135deg, #ff6078, #2a0c19 65%);
  box-shadow: 0 0 14px rgba(255, 62, 91, 0.7);
  animation-delay: -0.7s;
}

.fishMarker.yellow {
  background: linear-gradient(135deg, #ffe14e, #ff9f19 58%, #362000 60%);
  box-shadow: 0 0 14px rgba(255, 205, 45, 0.65);
  animation-delay: -1.2s;
}

.resourceMarker,
.ecoPoint,
.handoffPoint {
  position: absolute;
  display: grid;
  place-items: center;
  translate: -50% -50%;
}

.resourceMarker {
  z-index: 4;
  width: 4.1%;
  aspect-ratio: 1;
  border: 0.28em solid rgba(255, 255, 255, 0.5);
  border-radius: 999px;
  background: #1e91ff;
  box-shadow: 0 0 12px currentColor;
  animation: markerPulse 2.2s ease-in-out infinite;
}

.resourceMarker::before {
  position: absolute;
  bottom: 120%;
  left: 50%;
  padding: 0.2em 0.5em;
  border-radius: 4px;
  background: rgba(4, 26, 50, 0.75);
  color: #fff;
  content: attr(data-label);
  font-size: 0.88em;
  font-weight: 900;
  white-space: nowrap;
  translate: -50% 0;
}

.resourceMarker.yellow {
  color: #ffd529;
  background: #ffc40f;
}

.resourceMarker.green {
  color: #29f5a2;
  background: #1ede88;
}

.resourceMarker.purple {
  color: #b86bff;
  background: #8c3eff;
}

.resourceMarker.red-dot {
  color: #ff4a5f;
  background: #ff2f45;
}

.resourceMarker.black {
  color: #07111d;
  background: #07111d;
}

.ecoPoint,
.handoffPoint {
  z-index: 4;
  width: 9%;
  aspect-ratio: 1;
  border-radius: 999px;
  color: #fff;
  font-size: 0.9em;
  font-weight: 900;
  text-align: center;
}

.poolAxis {
  position: absolute;
  z-index: 4;
  color: rgba(235, 252, 255, 0.92);
  font-size: 0.95em;
  font-weight: 800;
  text-shadow: 0 0 8px rgba(0, 30, 60, 0.8);
}

.poolAxis.x {
  right: 4.4%;
  bottom: 2.6%;
}

.poolAxis.y {
  top: 2.8%;
  left: 1.5%;
  writing-mode: vertical-rl;
}

.ecoPoint {
  border: 0.45em solid rgba(49, 245, 162, 0.8);
  background: radial-gradient(circle, #19d35c 0 36%, rgba(15, 100, 48, 0.95) 37%);
  box-shadow: 0 0 18px rgba(41, 245, 162, 0.55);
}

.ecoPoint.a {
  left: 50%;
  top: 35%;
}

.ecoPoint.b {
  left: 50%;
  top: 75%;
}

.handoffPoint {
  left: 50%;
  top: 54%;
  border: 0.45em solid rgba(255, 176, 41, 0.86);
  background: radial-gradient(circle, #ffa31a 0 36%, rgba(126, 72, 0, 0.95) 37%);
  box-shadow: 0 0 18px rgba(255, 177, 46, 0.55);
}

.poolStage.compact .baseZone,
.poolStage.compact .resourceMarker::before,
.poolStage.compact .fishMarker::before {
  font-size: 0.66em;
}

.missionScreen {
  display: grid;
  grid-template-columns: 21.2% minmax(0, 50.8%) 27.2%;
  gap: 0.7%;
}

.taskSelect,
.missionArena,
.strategyPanel {
  padding: 3.5%;
}

.taskSelect {
  display: grid;
  grid-template-rows: 5% 6% 53% 33%;
  gap: 1.4%;
}

.taskSelect > div {
  display: grid;
  gap: 2.5%;
}

.taskCard {
  display: grid;
  grid-template-columns: 18% 1fr 8%;
  grid-template-rows: 1fr 1fr;
  gap: 0 4%;
  align-items: center;
  min-width: 0;
  padding: 4%;
  border: 1px solid rgba(84, 170, 255, 0.3);
  border-radius: 8px;
  background: rgba(7, 35, 68, 0.7);
  text-align: left;
}

.taskCard.selected {
  border-color: rgba(39, 238, 255, 0.95);
  box-shadow: 0 0 22px rgba(35, 217, 255, 0.22);
}

.taskIcon {
  grid-column: 1;
  grid-row: 1 / 3;
  width: 100%;
  aspect-ratio: 1;
  border: 0.25em solid #b9e6ff;
  border-radius: 8px;
}

.taskCard strong,
.taskCard small {
  grid-column: 2;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.taskCard strong {
  grid-row: 1;
  font-size: 1.24em;
  white-space: nowrap;
}

.taskCard small {
  grid-row: 2;
  color: #a8d5ed;
  white-space: normal;
}

.taskCard i {
  grid-column: 3;
  grid-row: 1 / 3;
  width: 1.4em;
  aspect-ratio: 1;
  border: 0.18em solid #3ddcff;
  border-radius: 999px;
}

.taskCard.selected i {
  background: #3df4ff;
  box-shadow: inset 0 0 0 0.28em #063160;
}

.requirements {
  display: grid;
  align-content: start;
  gap: 0.8em;
  padding-top: 5%;
  border-top: 1px solid rgba(88, 203, 255, 0.22);
}

.requirements h3 {
  font-size: 1.28em;
}

.requirements p {
  color: #5deaff;
  font-weight: 800;
}

.missionArena {
  display: grid;
  grid-template-rows: 7% minmax(0, 1fr) 14.5%;
  gap: 1.2%;
}

.missionArena header div {
  display: flex;
  gap: 0.8em;
}

.missionArena header span {
  padding: 0.55em 0.8em;
  border-radius: 6px;
  background: rgba(17, 154, 126, 0.5);
  color: #4affb7;
}

.poolStage.mission .baseZone {
  display: none;
}

.figureTrack {
  position: absolute;
  z-index: 3;
  border: 0.28em dashed rgba(71, 236, 255, 0.84);
  border-radius: 50%;
  pointer-events: none;
}

.figureTrack.main {
  left: 18%;
  top: 34%;
  width: 60%;
  height: 34%;
  border: 0;
}

.figureTrack.main::before,
.figureTrack.main::after {
  position: absolute;
  top: 0;
  width: 52%;
  height: 100%;
  border: 0.28em dashed rgba(71, 236, 255, 0.84);
  border-radius: 999px;
  content: "";
}

.figureTrack.main::before {
  left: 0;
  transform: rotate(17deg);
}

.figureTrack.main::after {
  right: 0;
  transform: rotate(-17deg);
}

.figureTrack.yellow {
  left: 17%;
  top: 32%;
  width: 25%;
  height: 30%;
  border-color: rgba(255, 211, 45, 0.82);
}

.figureTrack.red {
  left: 27%;
  top: 43%;
  width: 25%;
  height: 22%;
  border-color: rgba(255, 85, 103, 0.86);
}

.missionStats {
  grid-template-columns: repeat(4, 1fr);
}

.strategyPanel {
  display: grid;
  grid-template-rows: 5% 7% 7% 54% 8% 15%;
  gap: 1.5%;
}

.strategyTabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1%;
}

.strategyTabs button,
.strategyActions button {
  border: 1px solid rgba(69, 177, 255, 0.42);
  border-radius: 6px;
  background: rgba(12, 54, 103, 0.75);
  color: #caedff;
}

.strategyTabs .active {
  background: linear-gradient(180deg, #147eff, #0249a1);
  color: #f2fdff;
  box-shadow: 0 0 16px rgba(28, 184, 255, 0.42);
}

.blockStack {
  display: grid;
  align-content: start;
  gap: 1.1%;
  padding: 4%;
  overflow: hidden;
  border: 1px solid rgba(69, 165, 255, 0.22);
  border-radius: 8px;
  background:
    radial-gradient(circle, rgba(112, 194, 255, 0.18) 0 1px, transparent 1px 100%) 0 0 / 18px 18px,
    rgba(4, 21, 44, 0.72);
}

.block {
  width: 68%;
  min-height: 2.6em;
  padding: 0.62em 1em;
  border-radius: 6px;
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.16);
  font-size: 1.08em;
  font-weight: 900;
  transition: transform 170ms ease, filter 170ms ease;
}

.block:hover {
  filter: brightness(1.12);
  transform: translateX(0.35em);
}

.block.purple {
  background: linear-gradient(90deg, #b94bff, #d44dff);
}

.block.blue {
  margin-left: 5%;
  background: linear-gradient(90deg, #318cff, #5867ff);
}

.block.violet {
  margin-left: 5%;
  background: linear-gradient(90deg, #8749ff, #aa35ed);
}

.block.orange {
  margin-left: 5%;
  width: 78%;
  background: linear-gradient(90deg, #ffad15, #ff8717);
}

.block.red {
  margin-left: 5%;
  background: linear-gradient(90deg, #ff4665, #d82f5f);
}

.block.indent {
  margin-left: 13%;
}

.strategyActions {
  display: grid;
  grid-template-columns: 1fr 1fr 1.25fr;
  gap: 2%;
}

.strategyActions .deploy {
  background: linear-gradient(180deg, #2eff9d, #08a968);
  color: #012516;
}

.evalGrid {
  grid-template-columns: repeat(4, 1fr);
}

.evalGrid .statusTile {
  display: grid;
  align-content: center;
  justify-content: stretch;
}

.recordsScreen {
  display: grid;
  grid-template-columns: 17.3% minmax(0, 57.9%) 24%;
  gap: 0.7%;
}

.recordList {
  display: grid;
  grid-template-rows: 6% repeat(6, 14.5%);
  gap: 1.6%;
  padding: 4%;
}

.recordList header button {
  padding: 0.55em 1em;
  border: 1px solid rgba(70, 176, 255, 0.38);
  border-radius: 6px;
  background: rgba(13, 57, 104, 0.6);
}

.recordItem {
  display: grid;
  grid-template-columns: 18% 1fr 22%;
  grid-template-rows: repeat(3, 1fr);
  align-items: center;
  min-width: 0;
  padding: 3%;
  border: 1px solid rgba(75, 180, 255, 0.26);
  border-radius: 7px;
  background: rgba(7, 36, 70, 0.68);
  text-align: left;
}

.recordItem.active {
  border-color: rgba(42, 224, 255, 0.85);
  background: rgba(10, 67, 120, 0.82);
}

.recordThumb {
  grid-row: 1 / 4;
  width: 85%;
  aspect-ratio: 0.58;
  border: 1px solid rgba(139, 215, 255, 0.46);
  border-radius: 4px;
  background:
    linear-gradient(90deg, rgba(29, 113, 255, 0.6) 0 28%, transparent 28% 72%, rgba(255, 48, 74, 0.6) 72%),

  function lobbyPage() {

  }

  function matchHud() {
    return '<section class="matchHud"><div class="hudTop"><div class="hudTitle"><h2>生态资源应急修复对抗 · 2v2</h2><p>控制 · 策略 · 协作 · 共建水下生态</p></div><div class="hudScore"><span>本局积分</span><b class="blue">72</b><em>:</em><b class="red">60</b></div>' + statusTile('剩余时间', '01:28') + statusTile('资源采集', '3/6') + statusTile('生态点修复', '1/2', 'green') + statusTile('协同交付', '1/2', 'orange') + '<button type="button" class="visionBadge">视觉定位在线</button><button type="button" class="stopButton">急停</button></div><div class="phaseRail" aria-label="比赛准备进度"><span class="done">连接设备</span><span class="done">赛前试动</span><span class="active">正式操控</span><b>一切准备就绪 · 开始你的战术表现！</b></div></section>';

  function controlPage() {

  }

  function missionsPage() {
    const tasks = taskList.map(([title, text, icon], index) => '<button type="button" class="taskCard ' + (index === 2 ? 'selected' : '') + '"><span class="taskIcon ' + icon + '"></span><strong>' + title + '</strong><small>' + text + '</small><i></i></button>').join('');
    return '<section class="screen missionScreen"><aside class="taskSelect glassCard hoverCard"><h2>任务选择</h2><p>选择本次比赛要执行的自主任务</p><div>' + tasks + '</div><section class="requirements"><h3>任务要求</h3><p>红、黄、蓝三条鱼</p><p>蓝鱼领航，红黄跟随</p><p>完成 2 轮 8 字形</p><p>限时 120 秒</p><p>禁止越界</p></section></aside><main class="missionArena glassCard hoverCard"><header><h2>多鱼跟随 · 8 字形轨迹</h2><div><span>三鱼视觉定位在线</span><span>编队路径已验证</span></div></header>' + controlPool({ mission: true }) + '<div class="missionStats">' + statusTile('机器鱼', '3 条') + statusTile('轨迹', '2 轮') + statusTile('预计', '48 s') + statusTile('平均编队间距', '0.35 m') + '</div></main><aside class="strategyPanel glassCard hoverCard"><h2>策略与编程</h2><p>通过图形化编程设计算法策略，控制机器鱼完成任务</p><div class="strategyTabs"><button>路径规划</button><button class="active">图形化编程</button><button>Python（进阶）</button></div><div class="blockStack"><div class="block purple">当 任务开始</div><div class="block blue">设置蓝鱼为领航</div><div class="block blue">生成 8 字形轨迹</div><div class="block violet">红鱼、黄鱼跟随蓝鱼</div><div class="block orange">重复执行 2 轮</div><div class="block blue indent">沿 8 字形轨迹运动</div><div class="block red">完成 2 轮后停止</div></div><div class="strategyActions"><button type="button">仿真运行</button><button type="button">保存策略</button><button type="button" class="deploy">部署到比赛场地</button></div><div class="evalGrid">' + statusTile('红鱼间距', '0.34 m', 'red') + statusTile('黄鱼间距', '0.36 m', 'orange') + statusTile('轨迹偏差', '0.08 m') + statusTile('完成进度', '1/2') + '</div></aside></section>';

  function recordsPage() {

    return '<section class="screen recordsScreen"><aside class="recordList glassCard hoverCard"><header><h2>任务记录</h2><button type="button">全部类型</button></header>' + recordItems + '</aside><main class="replayPanel"><section class="recordHeader glassCard hoverCard"><div><h2>生态资源应急修复对抗 · 任务回放</h2><p>学生组 · 2v2 对抗任务</p></div><div class="winnerScore"><span>本局结果</span><strong>128 : 104</strong><b>本局获胜</b></div></section><section class="replayStage glassCard hoverCard"><header><h2>比赛视频回放</h2><select><option>多视角：俯视视角</option></select></header>' + controlPool() + '<footer class="playbar"><button type="button">暂停</button><span>01:27 / 04:00</span><i></i><select><option>1×</option></select></footer></section><section class="recordSummary"><article class="glassCard hoverCard"><h3>任务完成概览</h3><p>资源回收 <b>5/6</b></p><p>生态点修复 <b>2/2</b></p><p>协同交付 <b>2 次</b></p><p>违规 <b>0 次</b></p></article><article class="glassCard hoverCard"><h3>我的操控统计（B1）</h3><p>前进 <b>46%</b></p><p>左转 <b>18%</b></p><p>右转 <b>22%</b></p><p>停止 <b>14%</b></p></article><article class="glassCard hoverCard"><h3>队友协同表现（B2）</h3><p>资源传递 <b>6 次</b></p><p>修复支援 <b>4 次</b></p><p>协同距离 <b>1.2 m</b></p><p>有效协作时间 <b>72%</b></p></article></section></main><aside class="scorePanel glassCard hoverCard"><h2>本局积分</h2><div class="scoreTiles">' + statusTile('资源采集', '42 / 36') + statusTile('生态点修复', '40 / 30', 'green') + statusTile('协同交付', '30 / 30', 'orange') + statusTile('安全规范', '16 / 8') + '</div><section class="keyEvents"><h3>关键事件</h3><p><span>00:42</span> 蓝队 采集资源 #3 <b>+10</b></p><p><span>01:18</span> 红队 修复生态点 <b>+20</b></p><p><span>02:43</span> 蓝队 协同交付 <b>+15</b></p><p><span>04:00</span> 任务结束 <b>-</b></p></section><button type="button" class="retryButton">再次挑战</button></aside></section>';

  function render() {
    const page = pageFromHash();
    const pageConfig = pages.find((item) => item.id === page) || pages[0];
    const content = page === 'lobby' ? lobbyPage() : page === 'control' ? controlPage() : page === 'missions' ? missionsPage() : recordsPage();
    root.innerHTML = '<main class="competitionApp page-' + page + '" style="--page-ratio:' + pageConfig.ratio + ';--ratio-value:' + pageConfig.ratioValue + '"><div class="designShell">' + header(page) + content + '<footer class="competitionFooter"><span>边界保护：正常　队内通信：正常　延迟：12ms　丢包：0%</span><span>FISH CONTROL · STUDENT COMPETITION PLATFORM</span></footer></div></main>';
    bindInteractions();
  }

  function bindInteractions() {
    root.querySelectorAll('[data-page]').forEach((button) => {
      button.addEventListener('click', () => {
        const nextPage = button.getAttribute('data-page');
        if (!validPageIds.has(nextPage)) return;
        if (window.location.hash !== '#' + nextPage) window.location.hash = nextPage;
        else render();
      });
    });
    root.querySelectorAll('.dockNav').forEach((navEl) => {
      navEl.addEventListener('mousemove', (event) => {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        navEl.querySelectorAll('.dockItem').forEach((item) => {
          const rect = item.getBoundingClientRect();
          const distance = Math.abs(event.clientX - (rect.left + rect.width / 2));
          const influence = Math.max(0, 1 - distance / 180);
          const eased = influence * influence * (3 - 2 * influence);
          item.style.setProperty('--dock-scale', String((1 + eased * 0.18).toFixed(3)));
          item.style.setProperty('--dock-lift', (-eased * 8).toFixed(1) + 'px');
        });
      });
      navEl.addEventListener('mouseleave', () => {
        navEl.querySelectorAll('.dockItem').forEach((item) => {
          item.style.setProperty('--dock-scale', '1');
          item.style.setProperty('--dock-lift', '0px');
        });
      });
    });
  }

  window.addEventListener('hashchange', render);
  if (!validPageIds.has(pageFromHash())) window.location.hash = 'lobby';
  render();
})();
</script>
</body>
</html>
