<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">机器鱼控制平台技术架构</title>
  <desc id="desc">浏览器经过 Cloudflare 访问 Go 控制器，控制器连接视觉服务和 ESP32-C3 机器鱼。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#66808c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17313d" flood-opacity=".14"/>
    </filter>
    <style>
      .title { font: 600 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17313d; }
      .label { font: 500 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17313d; text-anchor: middle; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #46636f; text-anchor: middle; }
      .node { fill: #edf5fa; stroke: #66808c; stroke-width: 1.5; }
      .group { fill: #f7fafb; stroke: #b8cbd3; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .line { stroke: #66808c; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380" y="34" class="title" text-anchor="middle">机器鱼控制平台技术架构</text>

  <g filter="url(#shadow)">
    <rect x="285" y="64" width="190" height="48" rx="8" class="node"/>
    <text x="380" y="94" class="label">浏览器</text>

    <rect x="285" y="145" width="190" height="48" rx="8" class="node"/>
    <text x="380" y="175" class="label">Cloudflare 公网入口</text>

    <rect x="245" y="230" width="270" height="60" rx="8" class="node"/>
    <text x="380" y="257" class="label">Go 控制器</text>
    <text x="380" y="278" class="small">WebSocket · 设备 Hub · 租约</text>
  </g>

  <rect x="55" y="345" width="285" height="145" rx="12" class="group"/>
  <text x="197" y="372" class="label">视觉服务</text>
  <rect x="83" y="398" width="105" height="48" rx="8" class="node"/>
  <text x="135" y="427" class="label">摄像头</text>
  <rect x="202" y="398" width="110" height="48" rx="8" class="node"/>
  <text x="257" y="419" class="label">YOLO</text>
  <text x="257" y="437" class="small">跟踪 · 循迹</text>

  <rect x="420" y="345" width="285" height="145" rx="12" class="group"/>
  <text x="562" y="372" class="label">ESP32-C3 机器鱼</text>
  <rect x="448" y="398" width="142" height="48" rx="8" class="node"/>
  <text x="519" y="419" class="label">MAC 唯一标识</text>
  <text x="519" y="437" class="small">设备 WebSocket</text>
  <rect x="604" y="398" width="73" height="48" rx="8" class="node"/>
  <text x="640" y="419" class="label">舵机</text>
  <text x="640" y="437" class="small">GPIO2</text>
  <rect x="500" y="455" width="136" height="24" rx="6" class="node"/>
  <text x="568" y="472" class="small">电池 GPIO4 · 比例 3</text>

  <path d="M380 112 L380 145" class="line"/>
  <path d="M380 193 L380 230" class="line"/>
  <path d="M300 290 L197 398" class="line"/>
  <path d="M460 290 L562 398" class="line"/>
  <path d="M188 422 L202 422" class="line"/>
  <path d="M590 422 L604 422" class="line"/>
  <path d="M519 446 L548 455" class="line"/>
  <text x="238" y="333" class="small">视觉运动指令</text>
  <text x="522" y="333" class="small">WebSocket 控制</text>
</svg>
