[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
extra_scripts = pre:scripts/inject_deployment_key.py

monitor_speed = 115200
upload_speed = 115200
test_build_src = yes

; OTA-capable partition table (default.csv includes ota_0/ota_1 slots)
board_build.partitions = default.csv

build_flags =
    ; Keep the normal firmware quiet; NetworkManager prints only the
    ; successful Wi-Fi connection summary.
    -DCORE_DEBUG_LEVEL=0

monitor_filters =
    esp32_exception_decoder

lib_deps =
    links2004/WebSockets @ 2.6.1
    bblanchon/ArduinoJson @ 7.4.2
    adafruit/Adafruit NeoPixel @ 1.15.4

[env:native]
platform = native
test_framework = unity
test_build_src = yes
# Only host-compatible tests belong in this environment. Arduino, WiFi and
# mbedTLS dependent tests are compiled in embedded_test instead.
test_filter =
    test_config_persistence
    test_factory_wifi
    test_motion_state
    test_network_policy
extra_scripts = pre:scripts/native_test_env.py
build_flags = -std=gnu++17
build_src_filter =
    +<MotionState.cpp>
    +<NetworkPolicy.cpp>

[env:embedded_test]
extends = env:seeed_xiao_esp32c3
# Device-runtime tests are compiled with the Arduino framework. The injected
# deployment key script falls back to the public example key for this env.
test_filter =
    test_auth_protocol
    test_control_timing
    test_device_identity
    test_discovery_protocol
build_src_filter =
    +<*>
    -<main.cpp>
